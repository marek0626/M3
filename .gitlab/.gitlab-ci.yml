image: "registry.adbi.barkhauseninstitut.org/os/code/m3/m3/m3-ci:latest"

# run the pipeline only for merge requests into dev or master
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_MERGE_REQUEST_ID && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /dev|master/

stages:
  - prepare
  - build
  - check
  - test-host
  - test-gem5
  - submods
  - cleanup
  - dummy

prepare:
  stage: prepare
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS !~ /:no-ci:/'
  script:
    # ensure that no m3-ci pod is still around
    - kubectl delete -n os pod/m3-ci --now || true
    - kubectl wait -n os --for=delete --timeout=5m pod/m3-ci
    # now (re-)create the pod
    - sh ci/config/pod.sh m3-ci m3-ci | kubectl apply -f -
    - kubectl wait -n os --for=condition=ready --timeout=5m pod/m3-ci
    # copy bootstrap.py from current commit into pod
    - kubectl cp -n os ./ci/bootstrap.py m3-ci:/bootstrap.py
  resource_group: pod

build:
  stage: build
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS !~ /:no-ci:|:no-ci-build:/'
  script:
    - |
      kubectl exec -n os -t m3-ci -- \
        ./bootstrap.py $CI_COMMIT_SHA
  resource_group: pod

check:
  stage: check
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS !~ /:no-ci:|:no-ci-build:/'
  script:
    - kubectl exec -n os -t m3-ci -- sh -c "./bootstrap.py $CI_COMMIT_SHA"
    - kubectl exec -n os -t m3-ci -- sh -c 'cd M3 && nix develop path:nix -c ./b -n checkboot'
    - kubectl exec -n os -t m3-ci -- sh -c 'cd M3 && nix develop path:nix -c ./b -n fmt --check'
    - kubectl exec -n os -t m3-ci -- sh -c 'cd M3 && nix develop path:nix -c ./b -n clippy'
    - kubectl exec -n os -t m3-ci -- sh -c 'cd M3 && nix develop path:nix -c ./b -n lint'
    - |
      kubectl exec -n os -t m3-ci -- sh -c '
        cd M3 \
          && nix develop path:nix -c ./b -n doc 2>&1 | tee log.txt \
          && [ "$(grep error log.txt)" = "" ] \
        '
  resource_group: pod

test-host:
  stage: test-host
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS !~ /:no-ci:|:no-ci-tests:|:no-ci-build:/'
  script:
    - kubectl exec -n os -t m3-ci -- sh -c "./bootstrap.py $CI_COMMIT_SHA"
    - kubectl exec -n os -t m3-ci -- sh -c 'cd M3 && nix develop path:nix -c ./b -n test'
    - |
      kubectl exec -n os -t m3-ci -- sh -c "
        cd M3 \
          && nix develop path:nix -c ./b -n test --coverage \
          && mkdir -p /cache/results/$(date -I)-$CI_COMMIT_SHA \
          && cp -r build/rust/coverage /cache/results/$(date -I)-$CI_COMMIT_SHA \
        "
  resource_group: pod

test-gem5:
  stage: test-gem5
  allow_failure: true
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS !~ /:no-ci:|:no-ci-tests:|:no-ci-build:/'
  script:
    - kubectl exec -n os -t m3-ci -- sh -c "./bootstrap.py $CI_COMMIT_SHA"
    - kubectl exec -n os -t m3-ci -- sh -c "cd M3 && python3 ./ci/gcdir.py -m 10 /cache/results"
    - |
      kubectl exec -n os -t m3-ci -- sh -c " \
          cd M3 \
          && nix develop path:nix -c \
            ./ci/tests/gem5.py --no-build --publish /results --web /web \
              /cache/results/$(date -I)-$CI_COMMIT_SHA \
        "
  after_script:
    # copy generated web pages to the m3-ci-web pod
    - kubectl exec -n os -t m3-ci -- /M3/ci/web/publish.py /web
  resource_group: pod

submods:
  stage: submods
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS !~ /:no-ci:/'
  script:
    - kubectl exec -n os -t m3-ci -- sh -c "./bootstrap.py $CI_COMMIT_SHA --no-build"
    - kubectl exec -n os -t m3-ci -- sh -c "cd M3 && nix develop path:nix -c ./ci/submods-changed.py"
  when: always
  resource_group: pod

cleanup:
  stage: cleanup
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS !~ /:no-ci:/'
  script:
    - kubectl delete -n os pod/m3-ci --now || true
    - kubectl wait -n os --for=delete --timeout=5m pod/m3-ci
  when: always
  resource_group: pod

dummy:
  stage: dummy
  rules:
    - if: '$CI_MERGE_REQUEST_LABELS =~ /:no-ci:/'
  script:
    - echo "success"
