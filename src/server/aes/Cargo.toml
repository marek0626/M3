[package]
name = "aes"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/aes.rs"
crate-type = ["staticlib"]

[dependencies]
m3 = { path = "../../libs/rust/m3" }
num_enum = { version = "0.6.1", default-features = false }
serde_repr = "0.1.12"
serde = { version = "1.0.152", default-features = false, features = ["derive", "alloc"] }
