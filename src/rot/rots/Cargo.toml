[package]
name = "rots"
version = "0.1.0"
edition = "2021"
build = "../../build.rs"

[lib]
path = "src/rots.rs"
crate-type = ["staticlib"]

[dependencies]
base = { path = "../../libs/rust/base" }
lang = { path = "../../libs/rust/lang" }
rot = { path = "../../libs/crypto/rot" }
kecacc = { path = "../../libs/crypto/kecacc" }
heapsimple = { path = "../../libs/rust/heapsimple" }
m3core = { path = "../../libs/rust/m3core" }
num_enum = { version = "0.6.1", default-features = false }
unimux = { path = "../../unimux" }
